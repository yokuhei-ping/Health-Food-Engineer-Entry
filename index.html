<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>食品工程師｜歷屆試題線上練習</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f8fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
      --dark: #111827;
      --green: #166534;
      --green-bg: #f0fdf4;
      --green-border: #22c55e;
      --red: #b91c1c;
      --red-bg: #fef2f2;
      --red-border: #f87171;
      --amber: #92400e;
      --amber-bg: #fffbeb;
      --blue: #1d4ed8;
      --blue-bg: #eff6ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    button, select, input { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .45; }
    .container { width: min(100% - 28px, 1040px); margin: 0 auto; }
    header { padding: 28px 0 12px; }
    h1 { margin: 0; font-size: clamp(24px, 4vw, 34px); line-height: 1.25; }
    .subtitle { margin: 8px 0 0; color: var(--muted); font-size: 14px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 6px 20px rgba(17, 24, 39, .06);
      padding: 18px;
      margin: 14px 0;
    }
    .status {
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 14px;
      line-height: 1.55;
      margin-bottom: 14px;
      background: var(--blue-bg);
      color: var(--blue);
      border: 1px solid #bfdbfe;
    }
    .status.ok { background: var(--green-bg); color: var(--green); border-color: #bbf7d0; }
    .status.warn { background: var(--amber-bg); color: var(--amber); border-color: #fde68a; }
    .controls { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
    .field { display: grid; gap: 6px; }
    .field label { font-size: 13px; color: var(--muted); }
    select, input[type="number"], input[type="file"] {
      width: 100%;
      min-height: 42px;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      background: white;
      padding: 8px 10px;
      color: var(--text);
    }
    input[type="file"] { padding: 7px; }
    .actions { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 14px; align-items: center; }
    .btn {
      border: 1px solid #d1d5db;
      background: white;
      color: var(--text);
      border-radius: 12px;
      padding: 9px 14px;
      min-height: 40px;
    }
    .btn:hover { background: #f9fafb; }
    .btn.primary { background: var(--dark); color: white; border-color: var(--dark); }
    .btn.primary:hover { opacity: .9; }
    .meta { color: var(--muted); font-size: 13px; margin-top: 12px; line-height: 1.6; }
    .pills { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 14px; }
    .pill { background: #f3f4f6; border-radius: 999px; padding: 5px 9px; font-size: 12px; color: #4b5563; }
    .question { font-size: 19px; line-height: 1.7; font-weight: 650; white-space: pre-wrap; margin: 8px 0 16px; }
    .options { display: grid; gap: 10px; }
    .option {
      width: 100%;
      text-align: left;
      border: 1px solid #d1d5db;
      background: white;
      border-radius: 13px;
      padding: 13px 14px;
      line-height: 1.6;
      color: var(--text);
    }
    .option:hover { background: #f9fafb; }
    .option.selected { border-color: #6b7280; box-shadow: 0 0 0 2px rgba(107, 114, 128, .12); }
    .option.correct { border-color: var(--green-border); background: var(--green-bg); }
    .option.wrong { border-color: var(--red-border); background: var(--red-bg); }
    .answer-box { margin-top: 14px; font-size: 14px; line-height: 1.65; }
    .answer-box.good { color: var(--green); }
    .answer-box.bad { color: var(--red); }
    .answer-note { margin-top: 5px; color: var(--muted); }
    .nav { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 18px; }
    .nav .spacer { margin-left: auto; }
    .progress-line { font-size: 14px; margin-bottom: 8px; }
    .score { font-size: 20px; margin-bottom: 10px; }
    .empty { text-align: center; padding: 28px 10px; color: var(--muted); }
    footer { text-align: center; color: #9ca3af; font-size: 12px; padding: 24px 0 36px; }
    .hidden { display: none !important; }
    @media (max-width: 800px) {
      .controls { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 520px) {
      .container { width: min(100% - 18px, 1040px); }
      header { padding-top: 20px; }
      .card { padding: 14px; border-radius: 15px; }
      .controls { grid-template-columns: 1fr; }
      .question { font-size: 17px; }
      .nav .spacer { margin-left: 0; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>食品工程師｜歷屆試題線上練習</h1>
      <p class="subtitle">保健食品初級工程師＋食品品保初級工程師｜練習模式・模擬考・答案更正・錯題匯出</p>
    </header>

    <section class="card">
      <div id="status" class="status">正在啟動網站並載入題庫…</div>

      <div class="controls">
        <div class="field">
          <label for="examType">考試類別</label>
          <select id="examType"><option>全部考試類別</option></select>
        </div>
        <div class="field">
          <label for="subject">科目</label>
          <select id="subject"><option>全部科目</option></select>
        </div>
        <div class="field">
          <label for="year">年度</label>
          <select id="year"><option>全部年度</option></select>
        </div>
        <div class="field">
          <label for="mode">模式</label>
          <select id="mode">
            <option value="practice">練習（即時對答案）</option>
            <option value="exam">模擬考（交卷後揭曉）</option>
          </select>
        </div>
        <div class="field">
          <label for="limit">題數</label>
          <input id="limit" type="number" min="1" max="200" value="40" />
        </div>
      </div>

      <div class="actions">
        <button id="startBtn" class="btn primary">開始作答</button>
        <button id="reloadBtn" class="btn">重新載入 GitHub 題庫</button>
        <button id="exportWrongBtn" class="btn">匯出錯題本 CSV</button>
      </div>

      <div class="controls" style="margin-top:14px">
        <div class="field" style="grid-column: span 2;">
          <label for="bankFile">如果 GitHub 題庫載入失敗，可手動匯入題庫 CSV / JSON</label>
          <input id="bankFile" type="file" accept=".csv,.json" />
        </div>
        <div class="field" style="grid-column: span 2;">
          <label for="corrFile">手動匯入答案更正 CSV（選用）</label>
          <input id="corrFile" type="file" accept=".csv" />
        </div>
      </div>

      <div id="bankMeta" class="meta">目前題庫：0 題</div>
    </section>

    <section id="questionCard" class="card hidden">
      <div id="pills" class="pills"></div>
      <div id="questionText" class="question"></div>
      <div id="options" class="options"></div>
      <div id="answerBox" class="answer-box"></div>
      <div class="nav">
        <button id="prevBtn" class="btn">上一題</button>
        <button id="nextBtn" class="btn">下一題</button>
        <button id="firstBtn" class="btn spacer">回到第 1 題</button>
      </div>
    </section>

    <section id="progressCard" class="card hidden">
      <div id="progressLine" class="progress-line">作答進度：0/0 題</div>
      <div id="scoreLine" class="score">目前統計：0 / 0 題 正確</div>
      <div class="actions">
        <button id="submitBtn" class="btn primary">結束 / 交卷</button>
        <button id="reshuffleBtn" class="btn">重抽題目</button>
      </div>
      <div id="wrongLine" class="meta"></div>
    </section>

    <section id="emptyCard" class="card">
      <div class="empty">題庫載入後，就可以直接選年度、科目開始作答。</div>
    </section>

    <footer>© 食品工程師｜歷屆試題線上練習</footer>
  </div>

  <script>
    "use strict";

    const DEFAULT_BANK_URL = "./Question_All_Merged.csv";
    const DEFAULT_CORR_URL = "./exam_corrections_all_years.csv";

    const state = {
      bank: [],
      corrections: [],
      paper: [],
      answers: {},
      page: 0,
      started: false,
      finished: false,
      seconds: 0,
      timer: null,
    };

    const $ = (id) => document.getElementById(id);
    const els = {
      status: $("status"), examType: $("examType"), subject: $("subject"), year: $("year"), mode: $("mode"), limit: $("limit"),
      startBtn: $("startBtn"), reloadBtn: $("reloadBtn"), exportWrongBtn: $("exportWrongBtn"),
      bankFile: $("bankFile"), corrFile: $("corrFile"), bankMeta: $("bankMeta"),
      questionCard: $("questionCard"), pills: $("pills"), questionText: $("questionText"), options: $("options"), answerBox: $("answerBox"),
      prevBtn: $("prevBtn"), nextBtn: $("nextBtn"), firstBtn: $("firstBtn"),
      progressCard: $("progressCard"), progressLine: $("progressLine"), scoreLine: $("scoreLine"), submitBtn: $("submitBtn"), reshuffleBtn: $("reshuffleBtn"), wrongLine: $("wrongLine"),
      emptyCard: $("emptyCard")
    };

    function setStatus(message, type = "info") {
      els.status.textContent = message;
      els.status.className = "status" + (type === "ok" ? " ok" : type === "warn" ? " warn" : "");
    }

    function normalizeKey(key) {
      return String(key == null ? "" : key).replace(/^\uFEFF/, "").trim();
    }

    // 支援引號、逗號、換行的 CSV 解析器，不依賴任何外部 CDN。
    function parseCSV(text) {
      text = String(text || "").replace(/^\uFEFF/, "");
      const rows = [];
      let row = [];
      let field = "";
      let inQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        if (inQuotes) {
          if (ch === '"') {
            if (text[i + 1] === '"') {
              field += '"';
              i++;
            } else {
              inQuotes = false;
            }
          } else {
            field += ch;
          }
        } else {
          if (ch === '"') {
            inQuotes = true;
          } else if (ch === ',') {
            row.push(field);
            field = "";
          } else if (ch === '\n') {
            row.push(field.replace(/\r$/, ""));
            rows.push(row);
            row = [];
            field = "";
          } else {
            field += ch;
          }
        }
      }
      if (field.length || row.length) {
        row.push(field.replace(/\r$/, ""));
        rows.push(row);
      }
      if (!rows.length) return [];

      const headers = rows[0].map(normalizeKey);
      return rows.slice(1).filter(r => r.some(v => String(v).trim() !== "")).map(values => {
        const obj = {};
        headers.forEach((h, i) => { obj[h] = values[i] == null ? "" : values[i]; });
        return obj;
      });
    }

    function csvEscape(value) {
      const s = String(value == null ? "" : value);
      if (/[",\n\r]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
      return s;
    }

    function rowsToCSV(rows) {
      if (!rows.length) return "";
      const headers = Object.keys(rows[0]);
      const lines = [headers.map(csvEscape).join(",")];
      rows.forEach(row => lines.push(headers.map(h => csvEscape(row[h])).join(",")));
      return "\uFEFF" + lines.join("\r\n");
    }

    function valueFrom(obj, keys) {
      for (const key of keys) {
        if (obj[key] != null && String(obj[key]).trim() !== "") return obj[key];
      }
      return "";
    }

    function normalizeRow(raw) {
      const r = {};
      Object.keys(raw || {}).forEach(k => { r[normalizeKey(k)] = raw[k]; });
      return r;
    }

    function rowToQuestion(raw) {
      const r = normalizeRow(raw);
      const year = String(valueFrom(r, ["year", "年度", "年份"])).trim();
      const date = String(valueFrom(r, ["date", "日期"])).trim();
      const examType = String(valueFrom(r, ["exam_type", "考試類別", "考試類型"])).trim() || "未分類";
      const session = String(valueFrom(r, ["session", "場次", "_場次"])).trim();
      const subject = String(valueFrom(r, ["subject", "科目"])).trim();
      const questionNo = String(valueFrom(r, ["question_no", "題號", "題目編號", "no", "id"])).trim();
      const question = String(valueFrom(r, ["question", "題目", "stem"])).trim();
      const optionA = String(valueFrom(r, ["option_A", "A", "選項A"]));
      const optionB = String(valueFrom(r, ["option_B", "B", "選項B"]));
      const optionC = String(valueFrom(r, ["option_C", "C", "選項C"]));
      const optionD = String(valueFrom(r, ["option_D", "D", "選項D"]));
      const correct = String(valueFrom(r, ["correct_answers", "正確答案", "answer"])).replace(/\s/g, "");
      const notes = String(valueFrom(r, ["notes", "備註"]));
      const salt = date || session || question.slice(0, 30).replace(/\s+/g, "");
      const id = [examType, year, salt, subject, questionNo].join("-");
      return {
        id, year, date, exam_type: examType, session, subject, question_no: questionNo, question,
        option_A: optionA, option_B: optionB, option_C: optionC, option_D: optionD,
        options: [
          { key: "A", text: optionA }, { key: "B", text: optionB },
          { key: "C", text: optionC }, { key: "D", text: optionD }
        ],
        correct_answers: correct, notes
      };
    }

    function parseBank(rawRows) {
      let skipped = 0;
      const rows = rawRows.map(rowToQuestion).filter(q => {
        const ok = q.year && q.subject && q.question_no;
        if (!ok) skipped++;
        return ok;
      });
      return { rows, skipped };
    }

    function parseCorrections(rawRows) {
      return rawRows.map(raw => {
        const r = normalizeRow(raw);
        return {
          exam_type: String(valueFrom(r, ["exam_type", "考試類別", "考試類型"])).trim(),
          year: String(valueFrom(r, ["年度", "year"])).trim(),
          session: String(valueFrom(r, ["場次", "session", "_場次"])).trim(),
          subject: String(valueFrom(r, ["科目", "subject"])).trim(),
          question_no: String(valueFrom(r, ["題號", "question_no", "no"])).replace(/[^0-9.-]/g, ""),
          answer: String(valueFrom(r, ["正確答案", "correct_answers"])).replace(/\s/g, ""),
          notes: String(valueFrom(r, ["備註", "notes"]))
        };
      }).filter(c => c.year && c.subject && c.question_no && c.answer);
    }

    function applyCorrections(bank, corrections) {
      const typedExact = new Map();
      const typedGeneric = new Map();
      const legacyExact = new Map();
      const legacyGeneric = new Map();
      const typesByExact = new Map();
      const typesByGeneric = new Map();

      bank.forEach(q => {
        const genericKey = [q.year, q.subject, q.question_no].join("|");
        const exactKey = genericKey + "|" + q.session;
        if (!typesByGeneric.has(genericKey)) typesByGeneric.set(genericKey, new Set());
        if (!typesByExact.has(exactKey)) typesByExact.set(exactKey, new Set());
        typesByGeneric.get(genericKey).add(q.exam_type);
        typesByExact.get(exactKey).add(q.exam_type);
      });

      corrections.forEach(c => {
        const genericKey = [c.year, c.subject, c.question_no].join("|");
        const exactKey = genericKey + "|" + c.session;
        if (c.exam_type) {
          const typedBase = [c.exam_type, c.year, c.subject, c.question_no].join("|");
          if (c.session) typedExact.set(typedBase + "|" + c.session, c);
          else typedGeneric.set(typedBase, c);
        } else {
          if (c.session) legacyExact.set(exactKey, c);
          else legacyGeneric.set(genericKey, c);
        }
      });

      return bank.map(q => {
        const typedBase = [q.exam_type, q.year, q.subject, q.question_no].join("|");
        const genericKey = [q.year, q.subject, q.question_no].join("|");
        const exactKey = genericKey + "|" + q.session;

        let c = typedExact.get(typedBase + "|" + q.session) || typedGeneric.get(typedBase);

        // 舊版更正表沒有 exam_type 時，只有在該題不會跨考試類別撞號時才套用。
        if (!c && typesByExact.get(exactKey)?.size === 1) c = legacyExact.get(exactKey);
        if (!c && typesByGeneric.get(genericKey)?.size === 1) c = legacyGeneric.get(genericKey);

        if (!c) return q;
        return { ...q, correct_answers: c.answer, notes: c.notes || q.notes };
      });
    }

    async function fetchText(url) {
      const sep = url.includes("?") ? "&" : "?";
      const response = await fetch(url + sep + "v=" + Date.now(), { cache: "no-store" });
      if (!response.ok) throw new Error("HTTP " + response.status + "：" + url);
      return await response.text();
    }

    async function loadDefaults() {
      setStatus("正在從 GitHub Pages 載入題庫…");
      try {
        const bankText = await fetchText(DEFAULT_BANK_URL);
        const parsedBank = parseBank(parseCSV(bankText));

        let corrections = [];
        let corrWarning = "";
        try {
          const corrText = await fetchText(DEFAULT_CORR_URL);
          corrections = parseCorrections(parseCSV(corrText));
        } catch (err) {
          console.warn("更正表讀取失敗：", err);
          corrWarning = "；答案更正表暫時未載入";
        }

        state.corrections = corrections;
        state.bank = applyCorrections(parsedBank.rows, corrections);
        state.started = false;
        state.finished = false;
        state.paper = [];
        state.answers = {};
        refreshFilters();
        updateMeta();
        renderAll();
        setStatus(`✅ 題庫已載入 ${state.bank.length} 題；答案更正 ${corrections.length} 筆${parsedBank.skipped ? `；略過 ${parsedBank.skipped} 筆不完整資料` : ""}${corrWarning}`, corrWarning ? "warn" : "ok");
      } catch (err) {
        console.error(err);
        state.bank = [];
        refreshFilters();
        updateMeta();
        renderAll();
        setStatus("⚠️ 網站本體已正常啟動，但自動題庫載入失敗。請確認 Question_All_Merged.csv 與 index.html 在 GitHub 同一層；你也可以先用下方『手動匯入題庫』繼續使用。錯誤：" + (err.message || err), "warn");
      }
    }

    function uniqueSorted(values, numericDesc = false) {
      const arr = [...new Set(values.map(v => String(v || "").trim()).filter(Boolean))];
      return numericDesc ? arr.sort((a, b) => Number(b) - Number(a)) : arr.sort((a, b) => a.localeCompare(b, "zh-Hant"));
    }

    function fillSelect(select, firstLabel, values) {
      const old = select.value;
      select.innerHTML = "";
      const first = document.createElement("option");
      first.value = firstLabel;
      first.textContent = firstLabel;
      select.appendChild(first);
      values.forEach(v => {
        const o = document.createElement("option");
        o.value = v;
        o.textContent = v;
        select.appendChild(o);
      });
      if ([...select.options].some(o => o.value === old)) select.value = old;
    }

    function refreshFilters() {
      fillSelect(els.examType, "全部考試類別", uniqueSorted(state.bank.map(q => q.exam_type)));
      const examType = els.examType.value;
      const scoped = state.bank.filter(q => examType === "全部考試類別" || q.exam_type === examType);
      fillSelect(els.subject, "全部科目", uniqueSorted(scoped.map(q => q.subject)));
      fillSelect(els.year, "全部年度", uniqueSorted(scoped.map(q => q.year), true));
    }

    function filteredBank() {
      const examType = els.examType.value;
      const subject = els.subject.value;
      const year = els.year.value;
      return state.bank.filter(q =>
        (examType === "全部考試類別" || q.exam_type === examType) &&
        (subject === "全部科目" || q.subject === subject) &&
        (year === "全部年度" || q.year === year)
      );
    }

    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function startExam() {
      const filtered = filteredBank();
      if (!filtered.length) {
        alert("目前篩選條件沒有題目，請先載入題庫或改變年度／科目。");
        return;
      }
      const limit = Math.max(1, Math.min(200, Number(els.limit.value) || 40));
      els.limit.value = limit;
      state.paper = shuffle(filtered).slice(0, Math.min(limit, filtered.length));
      state.answers = {};
      state.page = 0;
      state.started = true;
      state.finished = false;
      state.seconds = 0;
      restartTimer();
      renderAll();
      window.scrollTo({ top: els.questionCard.offsetTop - 10, behavior: "smooth" });
    }

    function restartTimer() {
      if (state.timer) clearInterval(state.timer);
      state.timer = null;
      if (els.mode.value === "exam" && state.started && !state.finished) {
        state.timer = setInterval(() => {
          state.seconds++;
          renderPills();
        }, 1000);
      }
    }

    function formatTime(sec) {
      const mm = String(Math.floor(sec / 60)).padStart(2, "0");
      const ss = String(sec % 60).padStart(2, "0");
      return mm + ":" + ss;
    }

    function acceptedAnswers(q) {
      return String(q.correct_answers || "").split(",").map(x => x.trim()).filter(Boolean);
    }

    function isCorrect(q, answer) {
      return !!answer && acceptedAnswers(q).includes(answer);
    }

    function score() {
      let right = 0;
      state.paper.forEach(q => { if (isCorrect(q, state.answers[q.id])) right++; });
      return { right, total: state.paper.length };
    }

    function wrongList() {
      return state.paper.filter(q => !isCorrect(q, state.answers[q.id]));
    }

    function renderAll() {
      const show = state.started && state.paper.length > 0;
      els.questionCard.classList.toggle("hidden", !show);
      els.progressCard.classList.toggle("hidden", !show);
      els.emptyCard.classList.toggle("hidden", state.bank.length > 0 || show);
      if (show) renderQuestion();
      updateMeta();
      renderProgress();
    }

    function renderPills() {
      if (!state.paper.length) return;
      const q = state.paper[state.page];
      const parts = [
        els.mode.value === "exam" ? "模擬考" : "練習",
        q.exam_type || "未分類",
        q.subject || "—",
        (q.year || "—") + " 年",
        q.session || q.date || "",
        "題號：" + q.question_no,
        `第 ${state.page + 1} / ${state.paper.length} 題`
      ];
      if (els.mode.value === "exam") parts.push("計時：" + formatTime(state.seconds));
      els.pills.innerHTML = "";
      parts.filter(Boolean).forEach(text => {
        const span = document.createElement("span");
        span.className = "pill";
        span.textContent = text;
        els.pills.appendChild(span);
      });
    }

    function renderQuestion() {
      const q = state.paper[state.page];
      if (!q) return;
      renderPills();
      els.questionText.textContent = q.question || "（題目內容空白）";
      els.options.innerHTML = "";
      const selected = state.answers[q.id];
      const reveal = els.mode.value === "practice" || state.finished;
      const correctSet = acceptedAnswers(q);

      q.options.forEach(op => {
        const btn = document.createElement("button");
        btn.className = "option";
        btn.type = "button";
        btn.textContent = `(${op.key}) ${op.text || "—"}`;
        if (selected === op.key) btn.classList.add("selected");
        if (reveal && selected) {
          if (selected === op.key && correctSet.includes(op.key)) btn.classList.add("correct");
          else if (selected === op.key && !correctSet.includes(op.key)) btn.classList.add("wrong");
          if (state.finished && correctSet.includes(op.key)) btn.classList.add("correct");
        }
        btn.disabled = state.finished;
        btn.addEventListener("click", () => {
          state.answers[q.id] = op.key;
          renderQuestion();
          renderProgress();
        });
        els.options.appendChild(btn);
      });

      els.answerBox.className = "answer-box";
      els.answerBox.innerHTML = "";
      if (reveal) {
        if (!selected) {
          const div = document.createElement("div");
          div.style.color = "#6b7280";
          div.textContent = state.finished ? `未作答；正解：${q.correct_answers || "—"}` : "請選擇一個選項作答";
          els.answerBox.appendChild(div);
        } else {
          const ok = isCorrect(q, selected);
          els.answerBox.classList.add(ok ? "good" : "bad");
          const div = document.createElement("div");
          div.textContent = ok ? `✔ 答對！可接受答案：${q.correct_answers}` : `✘ 答錯，正解：${q.correct_answers || "—"}`;
          els.answerBox.appendChild(div);
        }
        if (q.notes) {
          const note = document.createElement("div");
          note.className = "answer-note";
          note.textContent = "備註：" + q.notes;
          els.answerBox.appendChild(note);
        }
      }

      els.prevBtn.disabled = state.page === 0;
      els.nextBtn.disabled = state.page >= state.paper.length - 1;
    }

    function renderProgress() {
      if (!state.paper.length) return;
      const answered = Object.keys(state.answers).filter(id => state.paper.some(q => q.id === id)).length;
      const s = score();
      const wrong = wrongList();
      els.progressLine.textContent = `作答進度：${answered}/${state.paper.length} 題`;
      if (els.mode.value === "exam" && !state.finished) {
        els.scoreLine.textContent = "模擬考進行中：交卷後顯示分數";
      } else {
        els.scoreLine.textContent = `目前統計：${s.right} / ${s.total} 題 正確`;
      }
      els.wrongLine.textContent = wrong.length ? `目前錯題／未作答：${wrong.length} 題，可匯出 CSV。` : "目前沒有錯題。";
      els.submitBtn.textContent = state.finished ? "已交卷" : "結束 / 交卷";
      els.submitBtn.disabled = state.finished;
    }

    function updateMeta() {
      const filtered = filteredBank();
      els.bankMeta.textContent = `目前題庫：${filtered.length} 題（符合篩選）／全部 ${state.bank.length} 題。自動檔名：Question_All_Merged.csv；更正表：exam_corrections_all_years.csv`;
    }

    function submitExam() {
      if (!state.started) return;
      state.finished = true;
      if (state.timer) clearInterval(state.timer);
      state.timer = null;
      renderAll();
      const s = score();
      if (els.mode.value === "exam") alert(`交卷完成！答對 ${s.right} / ${s.total} 題。`);
    }

    function exportWrong() {
      const rows = wrongList();
      if (!state.paper.length) {
        alert("請先開始作答，再匯出錯題本。");
        return;
      }
      if (!rows.length) {
        alert("目前沒有錯題可以匯出～");
        return;
      }
      const data = rows.map(q => ({
        year: q.year, date: q.date, exam_type: q.exam_type, _場次: q.session, subject: q.subject, question_no: q.question_no,
        question: q.question, option_A: q.option_A, option_B: q.option_B, option_C: q.option_C, option_D: q.option_D,
        correct_answers: q.correct_answers, your_answer: state.answers[q.id] || "", notes: q.notes
      }));
      const blob = new Blob([rowsToCSV(data)], { type: "text/csv;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "錯題本.csv";
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    async function importBankFile(file) {
      if (!file) return;
      try {
        const text = await file.text();
        let rawRows;
        if (file.name.toLowerCase().endsWith(".json")) {
          const json = JSON.parse(text);
          rawRows = Array.isArray(json) ? json : (json.items || []);
        } else {
          rawRows = parseCSV(text);
        }
        const parsed = parseBank(rawRows);
        state.bank = applyCorrections(parsed.rows, state.corrections);
        state.paper = [];
        state.answers = {};
        state.started = false;
        state.finished = false;
        refreshFilters();
        renderAll();
        setStatus(`✅ 已手動匯入 ${state.bank.length} 題${parsed.skipped ? `；略過 ${parsed.skipped} 筆不完整資料` : ""}`, "ok");
      } catch (err) {
        console.error(err);
        alert("題庫匯入失敗：" + (err.message || err));
      } finally {
        els.bankFile.value = "";
      }
    }

    async function importCorrectionFile(file) {
      if (!file) return;
      try {
        const corrections = parseCorrections(parseCSV(await file.text()));
        state.corrections = corrections;
        state.bank = applyCorrections(state.bank, corrections);
        renderAll();
        setStatus(`✅ 已手動匯入答案更正 ${corrections.length} 筆，並套用到目前題庫。`, "ok");
      } catch (err) {
        console.error(err);
        alert("答案更正表匯入失敗：" + (err.message || err));
      } finally {
        els.corrFile.value = "";
      }
    }

    els.startBtn.addEventListener("click", startExam);
    els.reloadBtn.addEventListener("click", loadDefaults);
    els.exportWrongBtn.addEventListener("click", exportWrong);
    els.examType.addEventListener("change", () => { refreshFilters(); updateMeta(); });
    els.subject.addEventListener("change", updateMeta);
    els.year.addEventListener("change", updateMeta);
    els.mode.addEventListener("change", () => {
      if (state.started) restartTimer();
      renderAll();
    });
    els.prevBtn.addEventListener("click", () => { if (state.page > 0) { state.page--; renderQuestion(); } });
    els.nextBtn.addEventListener("click", () => { if (state.page < state.paper.length - 1) { state.page++; renderQuestion(); } });
    els.firstBtn.addEventListener("click", () => { state.page = 0; renderQuestion(); });
    els.submitBtn.addEventListener("click", submitExam);
    els.reshuffleBtn.addEventListener("click", startExam);
    els.bankFile.addEventListener("change", e => importBankFile(e.target.files && e.target.files[0]));
    els.corrFile.addEventListener("change", e => importCorrectionFile(e.target.files && e.target.files[0]));

    window.addEventListener("error", event => {
      console.error("頁面錯誤：", event.error || event.message);
      if (!state.bank.length) setStatus("⚠️ 網站啟動時發生錯誤，但頁面本體仍可顯示。請把這段訊息截圖給我：" + (event.message || "未知錯誤"), "warn");
    });

    renderAll();
    loadDefaults();
  </script>
</body>
</html>
